# HTE, Inc. (2026-10-16): test and build the HTE image of the CortenDesk console
# for the VPS. Upstream's docker-release.yml stays as it is (it runs on a
# GitHub release, which this fork never publishes). amd64 only.
name: hte-image

on:
  workflow_dispatch:
  push:
    tags: ["v*-hte.*"]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/hte-test.Dockerfile -t hte-cortendesk-test .
      - run: docker run --rm hte-cortendesk-test

  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Work out the tag
        id: tag
        run: |
          ref="${GITHUB_REF_NAME}"
          case "$ref" in v*-hte.*) version="${ref#v}" ;; *) version="dev-${GITHUB_SHA::7}" ;; esac
          echo "tags=ghcr.io/regendorf-ux/hte-cortendesk:${version}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tag.outputs.tags }}
          labels: |
            org.opencontainers.image.title=HTE CortenDesk
            org.opencontainers.image.description=CortenDesk console with HTE's per-person reach enforcement. AGPL-3.0.
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.source=https://github.com/regendorf-ux/hte-cortendesk
